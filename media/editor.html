<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; img-src data: {cspSource}; style-src {cspSource} 'unsafe-inline'; font-src {cspSource}; script-src 'nonce-{nonce}';">
    <title>Minecraft 语言文件编辑器</title>
    <link rel="stylesheet" href="{cssUri}">
</head>
<body>
    <div id="app" class="hidden">
        <header id="toolbar">
            <div class="tb-row">
                <span class="folder-badge" title="" id="folderBadge"></span>
                <span id="bindInfo" class="muted"></span>
                <div class="spacer"></div>
                <button id="btnReload" class="tb" data-i18n-title="uiReloadTitle" title="从磁盘重载">⟳ <span data-i18n="reload">重载</span></button>
                <button id="btnUndo" class="tb" data-i18n-title="uiUndoTitle" title="撤销 (Ctrl+Z)" disabled data-i18n="uiUndo">↩ 撤销</button>
                <button id="btnRedo" class="tb" data-i18n-title="uiRedoTitle" title="重做 (Ctrl+Y)" disabled data-i18n="uiRedo">↪ 重做</button>
                <button id="btnAdd" class="tb accent" data-i18n-title="uiAddTitle" title="新增翻译 key（写入所有语言）" data-i18n="uiAdd">＋ 添加 key</button>
                <button id="btnDelete" class="tb danger" data-i18n-title="uiDeleteTitle" title="删除所选（所有语言）" disabled data-i18n="uiDelete">🗑 删除</button>
            </div>
            <div class="tb-row">
                <div class="filter-wrap">
                    <span class="filter-icon">🔍</span>
                    <input id="filterInput" type="text" spellcheck="false"
                           data-i18n-ph="uiFilterPh" placeholder="筛 key / 译文  (/)">
                </div>
                <label class="only-missing" title="仅当前语言为空的条目">
                    <input type="checkbox" id="onlyMissingCheck" data-i18n-ctx="uiOnlyMissing"> <span data-i18n="uiOnlyMissing">仅未译</span>
                </label>
                <div class="spacer"></div>
                <div class="lang-chips" id="langChips"></div>
            </div>
        </header>

        <div id="notices"></div>

        <div id="addBar" class="hidden">
            <input id="addKeyInput" type="text" spellcheck="false" data-i18n-ph="uiAddKeyPh" placeholder="key，如 item.minecraft.custom_sword">
            <textarea id="addValueInput" rows="2" spellcheck="false"
                      data-i18n-ph="uiAddValPh" placeholder="译文（其它语言留空）"></textarea>
            <div class="add-bar-buttons">
                <span class="muted" data-i18n="uiLang">语言</span>
                <div id="addLangSelect"></div>
                <div class="spacer"></div>
                <button id="addCancel" class="tb" data-i18n="uiCancel">取消</button>
                <button id="addOk" class="tb accent" data-i18n="uiOkAdd">添加</button>
            </div>
        </div>

        <main id="gridWrap">
            <div id="grid">
                <div id="headRow"></div>
                <div id="bodyScroll">
                    <div id="rowSpacer"></div>
                </div>
            </div>
            <div id="emptyState" class="hidden"></div>
        </main>

        <section id="detail" class="hidden">
            <div class="detail-head">
                <span class="muted" data-i18n="detailTitle">详情</span>
                <span class="spacer"></span>
                <span id="placeholderWarn" class="warn-chip hidden" title=""></span>
                <button id="btnCopyKey" class="tb small" data-i18n="ctxCopyKey">复制 key</button>
                <button id="btnDeleteOne" class="tb small danger" data-i18n="ctxDelete">删除此 key</button>
                <button id="btnCloseDetail" class="tb small" title="Esc">✕</button>
            </div>
            <div id="detailRows"></div>
        </section>

        <footer id="statusbar">
            <span id="statText"></span>
            <span class="spacer"></span>
            <span id="saveState" class="muted">✓ <span data-i18n="uiAutoSave">自动保存</span></span>
        </footer>
    </div>

    <div id="initFail" class="hidden"></div>

    <script nonce="{nonce}" src="{scriptUri}"></script>
</body>
</html>
